<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Undangan Kembaranas III</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      background-color: #2b2b2b;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .wrapper {
      position: relative;
      width: 100%;
      max-width: 600px;
    }
    .img-undangan {
      width: 100%;
      height: auto;
      display: block;
    }
    .nama-penerima {
      position: absolute;
      top: 36.5%; /* Atur letak tinggi tulisan nama di kotak putih */
      left: 73%;   /* Atur posisi samping tulisan nama di kotak putih */
      transform: translate(-50%, -50%);
      font-size: 1.1rem;
      font-weight: bold;
      color: #1a1a1a;
      text-align: center;
      width: 45%;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <img src="undangan.png" alt="Undangan Kembaranas III" class="img-undangan">
    <div class="nama-penerima" id="namaTamu">Nama Tamu / Kakak</div>
  </div>

  <script>
    // Membaca nama dari alamat web (URL)
    const urlParams = new URLSearchParams(window.location.search);
    const nama = urlParams.get('to');
    
    if (nama) {
      document.getElementById('namaTamu').innerText = nama;
    }
  </script>

</body>
</html>
